services:
  postgres:
    image: 'postgres:16'
    environment:
      POSTGRES_DB : chinook
      POSTGRES_PASSWORD : chinook
      POSTGRES_USER : chinook
    ports:
      - '5432:5432'

    volumes:
      - chinook-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinook -d chinook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chinook-data:
